{{ define "main" }}
<header class="site-header">
    <div class="header-content">
        <div class="logo">
            <span class="logo-icon">&#9917;</span>
            <h1>Sportnews</h1>
        </div>
        <div class="header-right">
            <span class="update-time">Τελευταία ενημέρωση: <span id="last-update">--:--</span></span>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">&#9789;</button>
        </div>
    </div>
</header>

<nav class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-country="all">Όλα</button>
    <button class="filter-btn" data-country="gr">Ελλάδα</button>
    <button class="filter-btn" data-country="uk">Αγγλία</button>
    <button class="filter-btn" data-country="it">Ιταλία</button>
    <button class="filter-btn" data-country="de">Γερμανία</button>
    <button class="filter-btn" data-country="fr">Γαλλία</button>
    <button class="filter-btn" data-country="es">Ισπανία</button>
    <button class="filter-btn filter-divider" disabled>|</button>
    <button class="filter-btn" data-country="cl">Champions League</button>
    <button class="filter-btn" data-country="el">Europa League</button>
    <button class="filter-btn" data-country="ecl">Conference League</button>
</nav>

<main class="news-feed">
    <div class="feed-container">
        <div id="news-container" class="news-list">
        </div>
        <div id="loading" class="skeleton-container">
            <div class="skeleton-card">
                <div class="skeleton-header"><div class="skeleton-badge"></div><div class="skeleton-time"></div></div>
                <div class="skeleton-body"><div class="skeleton-line skeleton-line-long"></div><div class="skeleton-line skeleton-line-medium"></div></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-header"><div class="skeleton-badge"></div><div class="skeleton-time"></div></div>
                <div class="skeleton-body"><div class="skeleton-line skeleton-line-long"></div><div class="skeleton-line skeleton-line-medium"></div></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-header"><div class="skeleton-badge"></div><div class="skeleton-time"></div></div>
                <div class="skeleton-body"><div class="skeleton-line skeleton-line-long"></div><div class="skeleton-line skeleton-line-medium"></div></div>
            </div>
        </div>
        <div id="load-more" class="load-more-btn" style="display: none;">
            <button onclick="loadMoreNews()">Φόρτωσε περισσότερα</button>
        </div>
    </div>
</main>

<section class="highlights-section" id="highlights-section">
    <div class="highlights-header">
        <h2>&#9917; ΓΚΟΛ</h2>
        <span class="highlights-subtitle">Τα γκολ και τα highlight των τελευταίων αγώνων</span>
    </div>
    <div class="highlights-tabs" id="highlights-tabs">
        <button class="hl-tab active" data-comp="all">Όλα</button>
        <button class="hl-tab" data-comp="cl">Champions League</button>
        <button class="hl-tab" data-comp="el">Europa League</button>
        <button class="hl-tab" data-comp="ecl">Conference League</button>
        <button class="hl-tab" data-comp="league">Πρωτάθλημα</button>
    </div>
    <div id="highlights-container" class="highlights-list">
    </div>
    <div id="highlights-loading" class="highlights-loading">
        <div class="skeleton-card" style="aspect-ratio:16/9;border-radius:12px;"></div>
        <div class="skeleton-card" style="aspect-ratio:16/9;border-radius:12px;"></div>
    </div>
    <div id="highlights-empty" class="empty-state" style="display:none;">
        <div class="icon">&#127916;</div>
        <h3>Δεν βρέθηκαν highlights</h3>
        <p>Δοκιμάστε αργότερα</p>
    </div>
</section>

<footer class="site-footer">
    <p>&copy; 2026 Sportnews - &#920;&#955;&#945; &#964;&#945; &#957;&#941;&#945; &#945;&#960;&#972; &#964;&#959;&#957; &#945;&#952;&#955;&#951;&#964;&#953;&#954;&#972; &#954;&#972;&#963;&#956;&#959;</p>
</footer>

<button id="back-to-top" class="back-to-top" onclick="scrollToTop()" aria-label="Back to top">&#8593;</button>
{{ end }}
