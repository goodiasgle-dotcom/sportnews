name: Update Sport News

on:
  schedule:
    # Every hour on weekdays (Mon-Fri)
    - cron: '0 * * * 1-5'
    # Every 30 minutes on weekends (Sat-Sun) - match days
    - cron: '0,30 * * * 0,6'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      
      - name: Fetch RSS feeds and translate
        run: python3 scripts/fetch_news.py
      
      - name: Build Hugo site
        run: hugo --minify --baseURL "https://goodiasgle-dotcom.github.io/sport-news-site/"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
