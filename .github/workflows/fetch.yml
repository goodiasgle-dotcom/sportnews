name: Fetch News & Highlights

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache translation cache
        uses: actions/cache@v4
        with:
          path: data/translation_cache.json
          key: translation-cache-${{ runner.os }}-${{ hashFiles('data/feeds.json') }}
          restore-keys: |
            translation-cache-${{ runner.os }}-

      - name: Fetch news
        run: python3 scripts/fetch_news.py

      - name: Fetch highlights
        run: python3 scripts/fetch_highlights.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/news.json static/highlights.json data/translation_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update news & highlights"
            git push
          fi